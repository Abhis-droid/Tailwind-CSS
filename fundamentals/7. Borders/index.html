<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Borders</title>
    <style></style>
  </head>
  <body >
    <!-- Borders -->
     <div class="border-2 border-green-800 m-10 ">
        <div class="w-96 m-3 p-5 border">Border All Around</div>
        <div class="w-96 m-3 p-5 border border-5">Border Width</div>
        <div class="w-96 m-3 p-5 border border-5 border-orange-500 border-dashed">Colored borders</div>
        <div class="w-96 m-3 p-5  border-x-5 border-orange-500 border-dashed mt-5">Colored Borders applied to x axis</div>
        <div class="w-96 m-3 p-5  border-y-5 border-orange-500 border-dashed mt-5">Colored Borders applied to Y axis</div>
        <div class="w-96 m-3 p-5  border-r-5 border-orange-500 border-dashed mt-5">Border Right</div>
        <div class="w-96 m-3 p-5  border-l-5 border-orange-500 border-dashed mt-5">Border Left</div>
        <div class="w-96 m-3 p-5  border-t-5 border-orange-500 border-dashed mt-5">Border Top</div>
        <div class="w-96 m-3 p-5  border-b-5 border-orange-500 border-dashed mt-5">Border Bottom</div>
     </div>

     <!-- Border Radius -->
      <div class="border-2 border-green-500 m-10">
        <div class="w-96 m-3 p-5 bg-teal-200 rounded">Border Rounded</div>
        <div class="w-96 m-3 p-5 bg-teal-200 rounded-lg">Border Rounded lg</div>
        <div class="w-96 m-3 p-5 bg-teal-200 rounded-xl">Border Rounded xl</div>
        <div class="w-96 m-3 p-5 bg-teal-200 rounded-3xl">Border Rounded 3xl</div>
        <div class="w-96 m-3 p-5 bg-teal-200 rounded-full">Border Rounded full</div>


        <!-- Specific Sides -->
          <div class="w-96 m-3 p-5 bg-teal-200 rounded-t-xl">Border Top Rounded </div>
          <div class="w-96 m-3 p-5 bg-teal-200 rounded-b-xl">Border Bottom Rounded </div>
      </div>


  </body>
</html>
